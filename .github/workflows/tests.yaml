name: Tests

on:
    push:
        branches:
            - 'v3'
    pull_request:
        branches:
            - 'v3'

jobs:
    build:
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                php-version:
                    - '8.3'
                    - '8.4'
                    - '8.5'
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}

            -   uses: actions/checkout@v6

            -   name: Validate composer.json
                run: composer validate

            -   name: Get Composer Cache Directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: Cache Composer packages
                uses: actions/cache@v5
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

            -   name: Install application dependencies
                run: composer install --prefer-dist --no-progress

            -   name: Install dev-ops dependencies
                run: composer install -d ./dev-ops/ci --prefer-dist --no-progress

            -   name: Store build
                uses: actions/cache@v5
                id: restore-build
                with:
                    path: ./*
                    key: ${{ runner.os }}-php-${{ matrix.php-version }}-build-${{ github.sha }}

    php-cs-fixer:
        runs-on: ubuntu-24.04
        needs: build
        strategy:
            matrix:
                php-version:
                    - '8.3'
                    - '8.4'
                    - '8.5'
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}

            -   name: Restore build
                uses: actions/cache@v5
                id: restore-build
                with:
                    path: ./*
                    key: ${{ runner.os }}-php-${{ matrix.php-version }}-build-${{ github.sha }}

            -   name: Run php-cs-fixer (dist)
                run: php dev-ops/ci/vendor/bin/php-cs-fixer fix --config dev-ops/ci/config/.php-cs-fixer.dist.php --dry-run --diff

            -   name: Run php-cs-fixer (legacy)
                run: php dev-ops/ci/vendor/bin/php-cs-fixer fix --config dev-ops/ci/config/.php-cs-fixer.legacy.php --dry-run --diff

    phpstan:
        runs-on: ubuntu-24.04
        needs: build
        strategy:
            matrix:
                php-version:
                    - '8.3'
                    - '8.4'
                    - '8.5'
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}

            -   name: Restore build
                uses: actions/cache@v5
                id: restore-build
                with:
                    path: ./*
                    key: ${{ runner.os }}-php-${{ matrix.php-version }}-build-${{ github.sha }}

            -   name: Run phpstan
                run: php -d memory_limit=-1 dev-ops/ci/vendor/bin/phpstan analyse -c dev-ops/ci/config/phpstan.neon
